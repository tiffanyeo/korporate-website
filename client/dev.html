<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVELOPMENT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            /* bakgrund runt mobilen */
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        main {
            /* iPhone Pro Max */
            max-width: 430px;
            min-height: 932px;
            /* iPhone Pro Max */
            margin: 30px auto;
            background-color: lightskyblue;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .blue {
            margin: 0;
            margin-bottom: 10px;
            background: var(--color-blue-120);
            color: var(--color-gray-100);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            background: #d6d3ce;
            border: 1px solid #7a7a7a;
            padding: 12px;
            margin-bottom: 10px;
            font-family: Tahoma, sans-serif;
            font-size: 12px;
            color: #000;
            box-shadow: inset 1px 1px 0 #fff;
        }

        .unread {
            background: #e7edf7;
        }

        .title {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #003399;
            font-weight: bold;
        }

        .mailMeta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-bottom: 10px;
            border-bottom: 1px solid #b1b1b1;
            padding-bottom: 4px;
        }

        .messageContent {
            line-height: 1.5;
        }

        .hackButton {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 14px;

            background: linear-gradient(#3d94ff, #1766d1);
            border: 1px solid #0b3f91;
            border-radius: 3px;

            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            font-family: Tahoma, sans-serif;

            cursor: pointer;

            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.5),
                1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .hackButton:hover {
            background: linear-gradient(#54a3ff, #2a75db);
        }
    </style>
</head>

<body>

    <div class="message">

        <h4 class="title">Your account has been created</h4>

        <div class="mailMeta">
            <span class="sender">carl.nielsen.korporate@gmail.com</span>

        </div>

        <p class="messageContent">
            No message.
        </p>

    </div>
    <script type="module" src="./dev.js"></script>

    <main>
        <div id="container">
            <div id=inbox>
                <div class="blue">
                    <h1>Systemlogg</h1>
                </div>
                <div class="message">

                    <h4 class="title">Your account has been created</h4>

                    <div class="mailMeta">
                        <span class="sender">carl.nielsen.korporate@gmail.com</span>

                    </div>

                    <p class="messageContent">
                        No message.
                    </p>

                </div>

            </div>
            <div id=sign-out>
                <div class="blue">
                    <h1>Logga ut</h1>
                </div>
                <sign-out-elem></sign-out-elem>
            </div>
        </div>
    </main>



</body>

</html>
