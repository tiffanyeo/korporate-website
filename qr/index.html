<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korporate</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #5999CB;

        }

        .text {
            text-align: center;
        }

        .choices-container {
            margin-top: 100px;
            justify-content: center;
            display: flex;
            flex-direction: row;
            gap: 50px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #BDBBB6;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            min-width: 200px;
            max-height: 200px;
            max-width: 270px;
            box-shadow: 2px 2px 15px 2px rgba(0, 0, 0, 0.501);
        }

        .choices:hover {
            background-color: #8E8C89;
        }

        .choice-icon {
            max-width: 100px;
            min-height: 50px;
        }

        .korporate-icon-container {
            display: flex;
            justify-content: center;
        }

        .korporate-icon {
            width: 150px;
            margin-top: 100px;

        }
    </style>
</head>

<body>

    <div id="container">
        <div class="text-info">
            <h2 class="text text-h2">Ditt sista val</h3>
                <p class="text text-p">Vad gjorde du av brevet?</p>
        </div>

        <div class="choices-container">
            <div class="choices choice1">
                <img src="./icon-trash.png" class="choice-icon" alt="">
                <p class="btn-info-text">Jag slängde brevet i papperskorgen.</p>

            </div>
            <div class="choices choice2">
                <img src="./icon-mail.png" class="choice-icon" alt="">
                <p class="btn-info-text">Jag la brevet i brevlådan.</p>
            </div>
        </div>

        <div class="korporate-icon">
            <img class="korporate-icon" src="./korporare.png" alt="">
        </div>
    </div>
    <script type="module" src="./dev.js"></script>
</body>

</html>
